# The full petri. stack: docker compose up -d --build
#
# Reads settings from the environment or a .env file next to this file
# (see .env.example, "Docker Compose" section). For local development
# without containers, use infrastructure/compose/dev.yml instead.
name: petri

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [internal]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]

x-database-env: &database-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://petri:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/petri

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: petri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: petri
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petri -d petri"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    image: petri-api
    environment:
      <<: *database-env
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:?Set PREVIEW_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      # Requests arrive through the web container on the internal network.
      TRUST_PROXY: ${PETRI_SUBNET:-172.31.250.0/24}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - uploads:/var/lib/petri/uploads
      # Build logs written by the worker; the API only reads them.
      - build-logs:/var/lib/petri/logs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    image: petri-worker
    # A fixed name: the worker joins each app's network by this name to
    # health-check it.
    container_name: petri-worker
    environment:
      <<: *database-env
      WORKER_CONTAINER: petri-worker
      PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:?Set PREVIEW_BASE_URL}
      EDGE_ADMIN_SOCKET: /run/petri-edge/admin.sock
      EDGE_CONTAINER: petri-edge
      EDGE_TRUSTED_PROXIES: ${EDGE_TRUSTED_PROXIES:-}
    networks: [internal, build, docker]
    volumes:
      - uploads:/var/lib/petri/uploads
      - workspaces:/var/lib/petri/workspaces
      - build-logs:/var/lib/petri/logs
      - edge-admin:/run/petri-edge
    depends_on:
      # The API applies database migrations on startup.
      api:
        condition: service_healthy
      edge:
        condition: service_healthy
    stop_grace_period: 40s

  # The worker's only access to Docker. Allows the containers, images and
  # networks APIs; exec, volumes, build, system and everything else are
  # blocked. It filters by API section, not by request content: the worker
  # itself fixes every container's security settings.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    networks: [docker]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Rootless BuildKit. Only the worker can reach it (the "build" network).
  # The relaxed confinement is what rootless mode needs to create its own
  # user namespace; build steps run as an unprivileged user on the host.
  buildkitd:
    image: moby/buildkit:v0.34.2-rootless
    restart: unless-stopped
    networks: [build]
    command:
      - --addr=tcp://0.0.0.0:1234
      - --config=/etc/buildkit/buildkitd.toml
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - ./infrastructure/buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
      - buildkit-state:/home/user/.local/share/buildkit

  # The edge proxy: routes preview hostnames to the apps, for NPM's
  # *.app proxy host. It joins every app's network, and Caddy's admin API
  # has no authentication, so the API is a Unix socket in a volume that
  # only the worker shares, never a network port.
  edge:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # A fixed name: it joins each routed app's network by this name.
    container_name: petri-edge
    command: [caddy, run, --config, /etc/caddy/edge.json]
    # The worker's user (node), so it can use the admin socket.
    user: "1000:1000"
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    environment:
      XDG_DATA_HOME: /tmp/data
      XDG_CONFIG_HOME: /tmp/config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Bind to the address NPM reaches.
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/caddy/edge.json:/etc/caddy/edge.json:ro
      - edge-admin:/run/petri-edge
    healthcheck:
      test: ["CMD", "test", "-S", "/run/petri-edge/admin.sock"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    image: petri-web
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      # The only published port. Bind to the address NPM reaches.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  internal:
    ipam:
      config:
        - subnet: ${PETRI_SUBNET:-172.31.250.0/24}
  # Worker ↔ BuildKit only. Builds reach the internet (base images,
  # packages) through it.
  build:
  # Worker ↔ Docker socket proxy only; no internet access needed.
  docker:
    internal: true
  # The edge proxy's published port. It reaches apps by joining their own
  # networks, not through this one.
  edge:

volumes:
  postgres-data:
  # ZIP uploads, kept so deployments can be rebuilt.
  uploads:
  # BuildKit's build cache (size-limited in buildkitd.toml).
  buildkit-state:
  # Sources and image archives during builds; emptied after each build.
  workspaces:
  # Build logs, kept with the deployment history.
  build-logs:
  # The edge proxy's admin socket. In memory, readable only by uid 1000.
  edge-admin:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0700
