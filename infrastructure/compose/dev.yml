# Local development services. Start with `pnpm dev:infra`.
name: petri-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: petri
      POSTGRES_PASSWORD: petri
      POSTGRES_DB: petri
    ports:
      # Loopback only: the dev database is not reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petri -d petri"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
