# Local development services. Start with `pnpm dev:infra`.
name: petri-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: petri
      POSTGRES_PASSWORD: petri
      POSTGRES_DB: petri
    ports:
      # Loopback only: the dev database is not reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petri -d petri"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Rootless BuildKit: build steps run as an unprivileged user on the host.
  # The relaxed confinement below is what rootless mode needs to create its
  # own user namespace; it is still far safer than a privileged daemon.
  buildkitd:
    image: moby/buildkit:v0.34.2-rootless
    command:
      - --addr=tcp://0.0.0.0:1234
      - --config=/etc/buildkit/buildkitd.toml
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - ../buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
      - buildkit-state:/home/user/.local/share/buildkit

volumes:
  postgres-data:
  buildkit-state:
