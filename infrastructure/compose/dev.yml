# Local development services. Start with `pnpm dev:infra`.
name: petri-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: petri
      POSTGRES_PASSWORD: petri
      POSTGRES_DB: petri
    ports:
      # Loopback only: the dev database is not reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petri -d petri"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Rootless BuildKit: build steps run as an unprivileged user on the host.
  # The relaxed confinement below is what rootless mode needs to create its
  # own user namespace; it is still far safer than a privileged daemon.
  buildkitd:
    image: moby/buildkit:v0.34.2-rootless
    command:
      - --addr=tcp://0.0.0.0:1234
      - --config=/etc/buildkit/buildkitd.toml
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    # Its own network, so the host firewall can tell build traffic apart.
    networks: [build]
    ports:
      - "127.0.0.1:1234:1234"
    volumes:
      - ../buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
      - buildkit-state:/home/user/.local/share/buildkit

  # The worker's only way to Docker. Allows the containers, images and
  # networks APIs; exec, volumes, build, system and everything else are
  # blocked.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"

  # The edge proxy: routes preview hostnames to apps. Previews are at
  # http://<subdomain>.app.localhost:8088. Its admin API is a Unix socket
  # in .tools/edge, where the worker on the host reaches it; the container
  # runs as your user (PETRI_UID/PETRI_GID if yours isn't 1000) so the
  # socket belongs to you.
  edge:
    image: caddy:2.11.9-alpine
    command: [caddy, run, --config, /etc/caddy/edge.json]
    user: "${PETRI_UID:-1000}:${PETRI_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    environment:
      XDG_DATA_HOME: /tmp/data
      XDG_CONFIG_HOME: /tmp/config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ../caddy/edge.json:/etc/caddy/edge.json:ro
      - ../../.tools/edge:/run/petri-edge
    healthcheck:
      test: ["CMD", "test", "-S", "/run/petri-edge/admin.sock"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  # The host interface name is what infrastructure/firewall/petri.nft
  # filters on.
  build:
    driver_opts:
      com.docker.network.bridge.name: pb-build

volumes:
  postgres-data:
  buildkit-state:
