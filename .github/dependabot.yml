version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js major in .nvmrc; bump both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # Paketo's builder and run image for apps without a Dockerfile: they
  # belong together, so they are updated together.
  - package-ecosystem: docker
    directory: /packages/build-engine/buildpacks
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      paketo:
        patterns: ["paketobuildpacks/*"]
