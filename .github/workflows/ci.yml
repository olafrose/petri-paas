name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: petri
          POSTGRES_PASSWORD: petri
          POSTGRES_DB: petri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petri -d petri"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://petri:petri@localhost:5432/petri
      BUILDKIT_HOST: tcp://127.0.0.1:1234
      DOCKER_PROXY_HOST: tcp://127.0.0.1:2375
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rootless BuildKit, as in production. Ubuntu runners restrict
      # unprivileged user namespaces by default; lift that on this
      # throwaway machine.
      - name: Start BuildKit
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run -d --name buildkitd \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -p 127.0.0.1:1234:1234 \
            moby/buildkit:v0.34.2-rootless --addr tcp://0.0.0.0:1234
          scripts/install-buildctl.sh
          for _ in $(seq 1 30); do
            .tools/bin/buildctl --addr "$BUILDKIT_HOST" debug workers && exit 0
            sleep 1
          done
          docker logs buildkitd
          exit 1

      - name: Start Docker socket proxy
        run: |
          docker run -d --name docker-proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 -e IMAGES=1 -e NETWORKS=1 -e POST=1 \
            -e ALLOW_START=1 -e ALLOW_STOP=1 \
            -p 127.0.0.1:2375:2375 \
            tecnativa/docker-socket-proxy:v0.5.0
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:2375/v1.47/_ping && exit 0
            sleep 1
          done
          docker logs docker-proxy
          exit 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/migrations
          test -z "$(git status --porcelain -- packages/database/migrations)"

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds for the production server (amd64). Not pushed yet; publishing
      # to GHCR comes with deploying to the petri. host.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
