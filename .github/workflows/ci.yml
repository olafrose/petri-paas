name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: petri
          POSTGRES_PASSWORD: petri
          POSTGRES_DB: petri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petri -d petri"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://petri:petri@localhost:5432/petri
      BUILDKIT_HOST: tcp://127.0.0.1:1234
      DOCKER_PROXY_HOST: tcp://127.0.0.1:2375
      EDGE_CONTAINER: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rootless BuildKit, as in production. Ubuntu runners restrict
      # unprivileged user namespaces by default; lift that on this
      # throwaway machine.
      - name: Start BuildKit
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # On its own network, as in Compose, for the firewall below.
          docker network create \
            -o com.docker.network.bridge.name=pb-build petri-build
          docker run -d --name buildkitd --network petri-build \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -p 127.0.0.1:1234:1234 \
            moby/buildkit:v0.34.2-rootless --addr tcp://0.0.0.0:1234
          scripts/install-buildctl.sh
          for _ in $(seq 1 30); do
            .tools/bin/buildctl --addr "$BUILDKIT_HOST" debug workers && exit 0
            sleep 1
          done
          docker logs buildkitd
          exit 1

      - name: Start Docker socket proxy
        run: |
          docker run -d --name docker-proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 -e IMAGES=1 -e NETWORKS=1 -e POST=1 \
            -e ALLOW_START=1 -e ALLOW_STOP=1 \
            -p 127.0.0.1:2375:2375 \
            tecnativa/docker-socket-proxy:v0.5.0
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:2375/v1.47/_ping && exit 0
            sleep 1
          done
          docker logs docker-proxy
          exit 1

      # As in infrastructure/compose/dev.yml: admin API on a socket in
      # .tools/edge, owned by the runner's user.
      - name: Start edge proxy
        run: |
          mkdir -p .tools/edge
          docker run -d --name edge \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp \
            -e XDG_DATA_HOME=/tmp/data -e XDG_CONFIG_HOME=/tmp/config \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/infrastructure/caddy/edge.json:/etc/caddy/edge.json:ro" \
            -v "$PWD/.tools/edge:/run/petri-edge" \
            -p 127.0.0.1:8088:8080 \
            caddy:2.11.9-alpine caddy run --config /etc/caddy/edge.json
          for _ in $(seq 1 30); do
            test -S .tools/edge/admin.sock && exit 0
            sleep 1
          done
          docker logs edge
          exit 1

      # Egress filtering as on a petri. host (infrastructure/firewall).
      # The probe must catch the leaks without it and pass with it; the
      # integration tests then run under it. 169.254.169.254 is the
      # runner's cloud metadata service: a real target that must be blocked.
      - name: Egress probe without the firewall (must fail)
        env:
          PROBE_BUILD_NETWORK: petri-build
          PROBE_LAN_TARGETS: 169.254.169.254 80
        run: "! scripts/probe-egress.sh"

      - name: Install the firewall
        run: |
          command -v nft || sudo apt-get install -y -q nftables
          sudo scripts/install-firewall.sh
          systemctl is-active petri-firewall.service

      - name: Egress probe with the firewall
        env:
          PROBE_BUILD_NETWORK: petri-build
          PROBE_LAN_TARGETS: 169.254.169.254 80
        run: scripts/probe-egress.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

      # Tests clean up what they create; a forgotten image or container
      # would pile up on every developer's machine.
      - name: Nothing left behind by the integration tests
        run: |
          left="$(docker images -q 'petri/*'; docker images -q 'petri-test/*'
            docker ps -aq --filter label=dev.petri.managed
            docker network ls -q --filter label=dev.petri.managed)"
          if [ -n "$left" ]; then
            docker images 'petri*/*'
            docker ps -a --filter label=dev.petri.managed
            docker network ls --filter label=dev.petri.managed
            exit 1
          fi

      # The whole stack in a browser, under the firewall (scripts/e2e.sh).
      - name: Install the browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          E2E_BROWSER: local
        run: pnpm test:e2e

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/results
          retention-days: 14

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/migrations
          test -z "$(git status --porcelain -- packages/database/migrations)"

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds for the production server (amd64). Published by the next job,
      # from main only, once everything passed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # ghcr.io/<owner>/petri-{api,worker,web}, tagged "main" and "sha-<commit>".
  # The production host pulls these (docs/operations.md). Rebuilt from the
  # images job's cache, so this is quick.
  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/petri-${{ matrix.target }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
